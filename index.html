<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Przesyłki">
<meta name="theme-color" content="#f3f3f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<title>Przesyłki</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  color-scheme:light;
  --bg:#f3f3f0;--s1:#ffffff;--s2:#f5f5f2;--s3:#e6e5e0;
  --t1:#141414;--t2:#5d5d58;--t3:#999893;
  --acc:#141414;--acc-t:#ffffff;
  --bord:#e3e2dd;--bord2:#cdccc6;
  --c-pending:#85847f;--c-transit:#2563eb;--c-out:#e05a0c;--c-pickup:#7c3aed;--c-delivered:#15913f;--c-problem:#d42626;--c-unknown:#a3a29d;
  --e-out:cubic-bezier(.23,1,.32,1);--e-drawer:cubic-bezier(.32,.72,0,1);
  --safe-b:env(safe-area-inset-bottom);--safe-t:env(safe-area-inset-top);
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --bg:#0d0d0d;--s1:#171717;--s2:#1f1f1f;--s3:#2b2b2b;
    --t1:#f2f2f2;--t2:#a3a3a3;--t3:#6b6b6b;
    --acc:#f2f2f2;--acc-t:#111111;
    --bord:#252525;--bord2:#383838;
    --c-pending:#9a9a9a;--c-transit:#60a5fa;--c-out:#fb923c;--c-pickup:#a78bfa;--c-delivered:#4ade80;--c-problem:#f87171;--c-unknown:#6b6b6b;
  }
}
html,body{background:var(--bg);color:var(--t1);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Inter,Roboto,sans-serif;min-height:100%;-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}

.app{max-width:620px;margin:0 auto;padding:calc(20px + var(--safe-t)) 16px calc(120px + var(--safe-b))}

/* header */
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.hd h1{font-size:32px;font-weight:800;letter-spacing:-.8px;line-height:1.05}
.hd p{font-size:13px;color:var(--t2);font-weight:500;margin-top:6px}
.hd-btns{display:flex;gap:8px;padding-top:2px}
.ib{width:40px;height:40px;border-radius:12px;background:var(--s1);border:1px solid var(--bord);display:flex;align-items:center;justify-content:center;color:var(--t1);font-size:14px;transition:transform .16s var(--e-out),border-color .2s}
.ib:hover{border-color:var(--bord2)}
.ib:active{transform:scale(.92)}
.ib.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* search + tabs */
.search{position:relative;margin-bottom:12px}
.search input{width:100%;height:44px;border-radius:12px;background:var(--s1);border:1px solid var(--bord);padding:0 14px 0 40px;font-size:15px;outline:none;transition:border-color .2s;-webkit-appearance:none}
.search input:focus{border-color:var(--t1)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--t3)}
.tabs{display:flex;background:var(--s3);border-radius:12px;padding:3px;margin-bottom:22px;position:relative}
.tab{flex:1;height:34px;border-radius:9px;font-size:13px;font-weight:600;color:var(--t2);position:relative;z-index:1;transition:color .2s}
.tab.on{color:var(--t1)}
.tab b{font-size:11px;font-weight:700;color:var(--t3);margin-left:4px}
.tab.on b{color:var(--t2)}
.tab-ind{position:absolute;top:3px;bottom:3px;left:3px;border-radius:9px;background:var(--s1);border:1px solid var(--bord);transition:transform .35s var(--e-out),width .35s var(--e-out);z-index:0}

/* list */
.grp{margin-bottom:22px}
.grp-h{font-size:12px;font-weight:700;color:var(--t2);margin:0 2px 8px;display:flex;align-items:center;gap:8px}
.grp-h i{width:8px;height:8px;border-radius:2px;display:inline-block}
.card{display:flex;gap:14px;align-items:center;padding:14px;border-radius:16px;background:var(--s1);border:1px solid var(--bord);margin-bottom:8px;cursor:pointer;transition:transform .16s var(--e-out),border-color .2s;animation:cardIn .35s var(--e-out) both}
.card:hover{border-color:var(--bord2)}
.card:active{transform:scale(.985)}
@keyframes cardIn{from{opacity:0;transform:translateY(6px)}}
.cb{width:44px;height:44px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;letter-spacing:.2px;position:relative}
.cb .dot{position:absolute;right:-3px;bottom:-3px;width:14px;height:14px;border-radius:50%;border:3px solid var(--s1)}
.ci{flex:1;min-width:0}
.ci h3{font-size:16px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px}
.ci p{font-size:13px;color:var(--t2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci small{display:block;font-size:11px;color:var(--t3);margin-top:3px}
.eta{flex-shrink:0;text-align:right}
.eta b{display:block;font-size:20px;font-weight:750;letter-spacing:-.5px;line-height:1}
.eta span{display:block;font-size:11px;font-weight:500;color:var(--t3);margin-top:3px}
.eta.today b{color:var(--c-out)}
.eta.late b{color:var(--c-problem)}
.eta .pill{display:inline-block;font-size:11px;font-weight:700;padding:5px 9px;border-radius:8px;margin-top:0}
.pill.ok{background:color-mix(in srgb,var(--c-delivered) 14%,transparent);color:var(--c-delivered)}
.pill.pk{background:color-mix(in srgb,var(--c-pickup) 14%,transparent);color:var(--c-pickup)}

.empty{text-align:center;padding:70px 20px;color:var(--t2)}
.empty .em-ic{width:80px;height:80px;margin:0 auto 18px;border-radius:22px;background:var(--s1);border:1px solid var(--bord);display:flex;align-items:center;justify-content:center;color:var(--t1)}
.empty h2{font-size:18px;font-weight:700;color:var(--t1);margin-bottom:6px}
.empty p{font-size:14px;line-height:1.5;max-width:300px;margin:0 auto}

/* FAB */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + var(--safe-b));z-index:20;height:54px;padding:0 24px 0 18px;border-radius:16px;background:var(--acc);color:var(--acc-t);font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;transition:transform .16s var(--e-out)}
.fab:active{transform:translateX(-50%) scale(.95)}

/* sheets */
.sw{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;visibility:hidden}
.sw.on{visibility:visible}
.sw-bg{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .3s}
.sw.on .sw-bg{opacity:1}
.sh{position:relative;width:100%;max-width:620px;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:10px 18px calc(24px + var(--safe-b));transform:translateY(100%);transition:transform .45s var(--e-drawer);overscroll-behavior:contain}
.sw.on .sh{transform:translateY(0)}
.grab{width:38px;height:5px;border-radius:9px;background:var(--bord2);margin:0 auto 14px}
@media(min-width:700px){
  .sw{align-items:center}
  .sh{border-radius:22px;max-height:86vh;transform:translateY(24px);opacity:0;transition:transform .35s var(--e-out),opacity .25s;padding-top:22px}
  .sw.on .sh{transform:none;opacity:1}
  .grab{display:none}
}
.sh-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.sh-h h2{font-size:21px;font-weight:750;letter-spacing:-.4px}

/* form */
.fl{display:block;font-size:13px;font-weight:600;color:var(--t2);margin:0 2px 7px}
.fg{margin-bottom:16px}
.in{width:100%;height:48px;border-radius:12px;background:var(--s1);border:1px solid var(--bord);padding:0 14px;font-size:16px;outline:none;transition:border-color .2s;-webkit-appearance:none}
.in:focus{border-color:var(--t1)}
textarea.in{height:auto;min-height:74px;padding:12px 14px;resize:vertical}
.in-row{display:flex;gap:8px}
.in-row .in{flex:1;min-width:0}
.in-row .ib{width:48px;height:48px;flex-shrink:0}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.3px}
.info-r .v.mono{font-size:12.5px;letter-spacing:0}
.hint{font-size:13px;color:var(--t2);margin:8px 2px 0;display:flex;align-items:center;gap:6px;min-height:16px}
.hint b{color:var(--t1)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:34px;padding:0 12px;border-radius:10px;background:var(--s1);border:1px solid var(--bord);font-size:13px;font-weight:600;color:var(--t2);display:flex;align-items:center;gap:7px;transition:border-color .2s,color .2s}
.chip i{width:9px;height:9px;border-radius:3px}
.chip.on{color:var(--t1);border-color:var(--t1);box-shadow:inset 0 0 0 1px var(--t1)}
.btn{width:100%;height:50px;border-radius:14px;font-size:15px;font-weight:650;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .16s var(--e-out),opacity .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5}
.btn-p{background:var(--acc);color:var(--acc-t)}
.btn-s{background:var(--s1);border:1px solid var(--bord);color:var(--t1)}
.btn-d{background:var(--s1);border:1px solid var(--bord);color:var(--c-problem)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}

/* detail */
.dt-top{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.dt-top .cb{width:54px;height:54px;border-radius:14px;font-size:14px}
.dt-top h2{font-size:21px;font-weight:750;letter-spacing:-.4px;line-height:1.2;word-break:break-word}
.dt-top p{font-size:13px;color:var(--t2);margin-top:3px}
.st-card{border-radius:16px;padding:16px 16px 16px 18px;margin-bottom:12px;border:1px solid var(--bord);background:var(--s1);position:relative;overflow:hidden}
.st-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--stc)}
.st-lbl{font-size:12px;font-weight:700;color:var(--stc)}
.st-txt{font-size:19px;font-weight:700;margin-top:4px;letter-spacing:-.3px;line-height:1.25}
.st-sub{font-size:13px;color:var(--t2);margin-top:6px}
.prog{display:flex;gap:5px;margin-top:16px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--s3);overflow:hidden;position:relative}
.prog i.on::after{content:'';position:absolute;inset:0;background:var(--stc);animation:fillIn .6s var(--e-out) both}
@keyframes fillIn{from{transform:translateX(-100%)}}
.prog-l{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;font-weight:500;color:var(--t3)}
.info{border-radius:16px;background:var(--s1);border:1px solid var(--bord);margin-bottom:12px}
.info-r{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--bord)}
.info-r:last-child{border-bottom:0}
.info-r .k{font-size:14px;color:var(--t2);flex-shrink:0}
.info-r .v{font-size:14px;font-weight:600;margin-left:auto;text-align:right;word-break:break-all}
.info-r button{color:var(--c-transit);font-size:14px;font-weight:600;flex-shrink:0}
.tl{margin:20px 0 6px}
.tl-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.tl-h h3{font-size:17px;font-weight:700}
.tl-h button{font-size:14px;font-weight:600;color:var(--c-transit)}
.ev{display:flex;gap:14px;position:relative;padding-bottom:18px}
.ev::before{content:'';position:absolute;left:6px;top:18px;bottom:-2px;width:2px;background:var(--s3)}
.ev:last-child::before{display:none}
.ev-d{width:14px;height:14px;border-radius:50%;background:var(--s3);border:3px solid var(--bg);flex-shrink:0;margin-top:3px;position:relative;z-index:1}
.ev:first-child .ev-d{background:var(--stc)}
.ev-t{font-size:15px;font-weight:600;line-height:1.35}
.ev:not(:first-child) .ev-t{color:var(--t2);font-weight:500}
.ev-m{font-size:12px;color:var(--t3);margin-top:3px}
.tl-empty{font-size:14px;color:var(--t2);background:var(--s1);border:1px dashed var(--bord2);border-radius:14px;padding:16px;line-height:1.5}

/* scan */
.scan-box{position:relative;border-radius:18px;overflow:hidden}
.scan-v{width:100%;aspect-ratio:3/4;max-height:60vh;background:#000;object-fit:cover;display:block}
.scan-box::after{content:'';position:absolute;left:12%;right:12%;top:40%;height:20%;border:2px solid #fff;border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none}

/* toggle */
.tg-r{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px;border-bottom:1px solid var(--bord)}
.tg-r:last-child{border-bottom:0}
.tg-r div b{display:block;font-size:15px;font-weight:600}
.tg-r div span{display:block;font-size:13px;color:var(--t2);margin-top:3px;line-height:1.4}
.tg{width:50px;height:30px;border-radius:99px;background:var(--s3);position:relative;flex-shrink:0;transition:background .25s}
.tg::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .3s var(--e-out)}
.tg.on{background:var(--c-delivered)}
.tg.on::after{transform:translateX(20px)}
.note{font-size:13px;color:var(--t2);line-height:1.55;padding:14px 16px}
.note code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--s3);padding:2px 6px;border-radius:6px;color:var(--t1)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translate(-50%,20px);opacity:0;transition:transform .35s var(--e-out),opacity .25s;z-index:90;background:var(--acc);color:var(--acc-t);padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <header class="hd">
    <div>
      <h1>Przesyłki</h1>
      <p id="summary">&nbsp;</p>
    </div>
    <div class="hd-btns">
      <button class="ib" id="refreshAll" aria-label="Odśwież wszystkie"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
      <button class="ib" onclick="openSettings()" aria-label="Ustawienia"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
  </header>

  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Szukaj po nazwie lub numerze" autocomplete="off">
  </div>

  <div class="tabs" id="tabs">
    <div class="tab-ind" id="tabInd"></div>
    <button class="tab on" data-tab="active">Aktywne<b id="cnt-active"></b></button>
    <button class="tab" data-tab="delivered">Odebrane<b id="cnt-delivered"></b></button>
    <button class="tab" data-tab="archived">Archiwum<b id="cnt-archived"></b></button>
  </div>

  <main id="list"></main>
</div>

<button class="fab" onclick="openAdd()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Dodaj przesyłkę</button>

<!-- ADD / EDIT -->
<div class="sw" id="addSheet"><div class="sw-bg" onclick="closeSheet('addSheet')"></div>
  <div class="sh">
    <div class="grab"></div>
    <div class="sh-h"><h2 id="addTitle">Nowa przesyłka</h2><button class="ib" onclick="closeSheet('addSheet')" aria-label="Zamknij">✕</button></div>
    <div class="fg">
      <label class="fl" for="fNum">Numer przesyłki</label>
      <div class="in-row">
        <input class="in mono" id="fNum" placeholder="np. 602677123456789012345678" autocomplete="off" autocapitalize="characters" spellcheck="false">
        <button class="ib" onclick="pasteNum()" aria-label="Wklej"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg></button>
        <button class="ib" onclick="openScan()" aria-label="Skanuj kod"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10 8v8M14 8v8M17 8v8"/></svg></button>
      </div>
      <div class="hint" id="detHint"></div>
    </div>
    <div class="fg">
      <label class="fl" for="fName">Co to za paczka?</label>
      <input class="in" id="fName" placeholder="np. Słuchawki z Allegro" autocomplete="off">
    </div>
    <div class="fg">
      <label class="fl">Przewoźnik</label>
      <div class="chips" id="carrierChips"></div>
    </div>
    <div class="fg">
      <label class="fl" for="fEta">Przewidywana dostawa (opcjonalnie)</label>
      <input class="in" id="fEta" type="date">
    </div>
    <div class="fg">
      <label class="fl" for="fNote">Notatka</label>
      <textarea class="in" id="fNote" placeholder="np. kod odbioru, sklep, wartość"></textarea>
    </div>
    <button class="btn btn-p" id="saveBtn" onclick="saveParcel()">Dodaj przesyłkę</button>
  </div>
</div>

<!-- DETAIL -->
<div class="sw" id="detSheet"><div class="sw-bg" onclick="closeSheet('detSheet')"></div>
  <div class="sh" id="detBody"></div>
</div>

<!-- MANUAL EVENT -->
<div class="sw" id="evSheet"><div class="sw-bg" onclick="closeSheet('evSheet')"></div>
  <div class="sh">
    <div class="grab"></div>
    <div class="sh-h"><h2>Dodaj status</h2><button class="ib" onclick="closeSheet('evSheet')" aria-label="Zamknij">✕</button></div>
    <div class="fg"><label class="fl">Etap</label><div class="chips" id="evChips"></div></div>
    <div class="fg"><label class="fl" for="evText">Opis</label><input class="in" id="evText" placeholder="np. Paczka w sortowni Warszawa"></div>
    <div class="fg"><label class="fl" for="evLoc">Miejsce (opcjonalnie)</label><input class="in" id="evLoc" placeholder="np. Kraków"></div>
    <button class="btn btn-p" onclick="saveEvent()">Zapisz status</button>
  </div>
</div>

<!-- SCAN -->
<div class="sw" id="scanSheet"><div class="sw-bg" onclick="closeScan()"></div>
  <div class="sh">
    <div class="grab"></div>
    <div class="sh-h"><h2>Skanuj kod</h2><button class="ib" onclick="closeScan()" aria-label="Zamknij">✕</button></div>
    <div class="scan-box"><video class="scan-v" id="scanV" playsinline muted></video></div>
    <p class="hint" id="scanHint" style="justify-content:center;margin-top:14px">Nakieruj aparat na kod kreskowy z etykiety</p>
  </div>
</div>

<!-- SETTINGS -->
<div class="sw" id="setSheet"><div class="sw-bg" onclick="closeSheet('setSheet')"></div>
  <div class="sh">
    <div class="grab"></div>
    <div class="sh-h"><h2>Ustawienia</h2><button class="ib" onclick="closeSheet('setSheet')" aria-label="Zamknij">✕</button></div>

      <div class="tg-r"><div><b>Powiadomienia</b><span>Alert, gdy zmieni się status paczki (przy otwartej aplikacji)</span></div><button class="tg" id="tgNotify" onclick="toggleNotify()" aria-label="Powiadomienia"></button></div>
      <div class="tg-r"><div><b>Auto-odświeżanie</b><span>Sprawdzaj statusy co 15 minut</span></div><button class="tg" id="tgAuto" onclick="toggleAuto()" aria-label="Auto-odświeżanie"></button></div>
    </div>

      <button class="btn btn-s" onclick="syncNow(true)">Synchronizuj</button>

    <input type="file" id="impFile" accept="application/json" hidden onchange="importData(event)">
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══ PRZEWOŹNICY ═══ */
const CARRIERS = {
  inpost:  {name:'InPost',         short:'IP',  bg:'#ffcd00', fg:'#1d1d1b', url:n=>`https://inpost.pl/sledzenie-przesylek?number=${n}`},
  dpd:     {name:'DPD',            short:'DPD', bg:'#dc0032', fg:'#fff',    url:n=>`https://tracktrace.dpd.com.pl/parcelDetails?typ=1&p1=${n}`},
  dhl:     {name:'DHL',            short:'DHL', bg:'#ffcc00', fg:'#d40511', url:n=>`https://www.dhl.com/pl-pl/home/sledzenie-przesylek.html?tracking-id=${n}`},
  poczta:  {name:'Poczta Polska',  short:'PP',  bg:'#e30613', fg:'#fff',    url:n=>`https://emonitoring.poczta-polska.pl/?numer=${n}`},
  orlen:   {name:'Orlen Paczka',   short:'OP',  bg:'#e2001a', fg:'#fff',    url:n=>`https://www.orlenpaczka.pl/sledz-paczke/?numer=${n}`},
  gls:     {name:'GLS',            short:'GLS', bg:'#061ab1', fg:'#ffd100', url:n=>`https://gls-group.com/PL/pl/sledzenie-paczek?match=${n}`},
  ups:     {name:'UPS',            short:'UPS', bg:'#351c15', fg:'#ffb500', url:n=>`https://www.ups.com/track?loc=pl_PL&tracknum=${n}`},
  fedex:   {name:'FedEx',          short:'FX',  bg:'#4d148c', fg:'#ff6600', url:n=>`https://www.fedex.com/fedextrack/?trknbr=${n}`},
  allegro: {name:'Allegro One',    short:'A1',  bg:'#ff5a00', fg:'#fff',    url:n=>`https://allegro.pl/allegrodelivery/sledzenie-paczki?numer=${n}`},
  amazon:  {name:'Amazon',         short:'AMZ', bg:'#232f3e', fg:'#ff9900', url:n=>`https://track.amazon.com/tracking/${n}`},
  other:   {name:'Inny',           short:'•••', bg:'#2a221c', fg:'#a89f97', url:n=>`https://t.17track.net/pl#nums=${n}`},
};

function detectCarrier(raw){
  const n = String(raw||'').toUpperCase().replace(/\s+/g,'');
  if(!n) return null;
  if(/^\d{24}$/.test(n)) return 'inpost';
  if(/^1Z[0-9A-Z]{16}$/.test(n)) return 'ups';
  if(/^TBA\d{9,}$/.test(n)) return 'amazon';
  if(/^JJD\d+$/.test(n) || /^JVGL\d+$/.test(n)) return 'dhl';
  if(/^[A-Z]{2}\d{9}PL$/.test(n)) return 'poczta';
  if(/^00\d{18}$/.test(n) || /^PX\d+/.test(n)) return 'poczta';
  if(/^\d{13}[A-Z]$/.test(n) || /^\d{14}$/.test(n)) return 'dpd';
  if(/^\d{10,11}$/.test(n)) return 'dhl';
  if(/^(\d{12}|\d{15}|\d{20}|\d{22})$/.test(n)) return 'fedex';
  if(/^[A-Z]{2}\d{9}[A-Z]{2}$/.test(n)) return 'other';
  return null;
}

/* ═══ STATUSY ═══ */
const STATUS = {
  pending:  {label:'Czeka na nadanie', group:'Oczekujące',     step:0, color:'var(--c-pending)'},
  transit:  {label:'W drodze',         group:'W drodze',       step:1, color:'var(--c-transit)'},
  out:      {label:'W doręczeniu',     group:'Dziś u Ciebie',  step:2, color:'var(--c-out)'},
  pickup:   {label:'Do odbioru',       group:'Do odbioru',     step:2, color:'var(--c-pickup)'},
  delivered:{label:'Doręczona',        group:'Odebrane',       step:3, color:'var(--c-delivered)'},
  problem:  {label:'Wymaga uwagi',     group:'Wymaga uwagi',   step:1, color:'var(--c-problem)'},
  unknown:  {label:'Brak informacji',  group:'Oczekujące',     step:0, color:'var(--c-unknown)'},
};
const GROUP_ORDER = ['pickup','out','problem','transit','pending','unknown'];

/* ═══ STAN ═══ */
const LS_KEY = 'parcels-v1';
let S = {parcels:[], deleted:{}, settings:{notify:false, auto:true}};
let ui = {tab:'active', q:'', editId:null, detId:null, carrier:null, carrierManual:false, evStatus:'transit', busy:new Set()};

function load(){
  try{const r=localStorage.getItem(LS_KEY); if(r){const d=JSON.parse(r); S={...S,...d,deleted:d.deleted||{},settings:{...S.settings,...(d.settings||{})}};}}catch{}
}
function save(push=true){
  try{localStorage.setItem(LS_KEY, JSON.stringify(S))}catch{}
  if(push) schedulePush();
}
// oznacz paczkę jako zmienioną (nowsza wersja wygrywa przy synchronizacji)
function touch(p){ p.u = Date.now() }

/* ═══ SYNCHRONIZACJA MIĘDZY URZĄDZENIAMI ═══ */
let pushT=null, syncing=false, syncAgain=false;
let syncInfo = {state:null, last:0};   // state: 'on' | 'off' | 'error'
function schedulePush(){clearTimeout(pushT); pushT=setTimeout(()=>syncNow(false), 800)}
function mergeState(a, b){
  const deleted = {...(a.deleted||{})};
  for(const [id,ts] of Object.entries(b.deleted||{})) deleted[id] = Math.max(deleted[id]||0, ts||0);
  const byId = new Map();
  for(const p of [...(a.parcels||[]), ...(b.parcels||[])]){
    if(!p||!p.id) continue;
    const have = byId.get(p.id);
    if(!have || (p.u||0) > (have.u||0)) byId.set(p.id, p);
  }
  const parcels = [...byId.values()].filter(p=>!(deleted[p.id] && deleted[p.id] >= (p.u||0)))
    .sort((x,y)=>new Date(y.created||0)-new Date(x.created||0));
  return {parcels, deleted};
}
function sig(st){ return JSON.stringify(st.parcels.map(p=>[p.id,p.u||0]))+JSON.stringify(st.deleted) }
async function syncNow(loud){
  if(syncing){ syncAgain=true; return }
  syncing=true;
  try{
    const before = sig(S);
    const r = await fetch('/api/parcels',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({parcels:S.parcels, deleted:S.deleted})});
    if(r.status===401){ location.reload(); return }
    if(r.status===503){ syncInfo.state='off'; if(loud) toast('Synchronizacja wyłączona — podłącz bazę w Vercelu'); return }
    if(!r.ok) throw new Error(r.status);
    const remote = await r.json();
    const merged = mergeState(S, remote);           // zmiany zrobione w trakcie wysyłki zostają
    const changed = sig(merged)!==before;
    S.parcels = merged.parcels; S.deleted = merged.deleted;
    save(false);
    syncInfo = {state:'on', last:Date.now()};
    if(changed){
      render();
      if(ui.detId && $('detSheet').classList.contains('on')) renderDetail();
    }
    if(loud) toast(changed?'Pobrano zmiany z innych urządzeń ✓':'Zsynchronizowano ✓');
  }catch{
    syncInfo.state='error';
    if(loud) toast('Brak połączenia z serwerem');
  }finally{
    syncing=false;
    if($('setSheet').classList.contains('on')) paintSettings();
    if(syncAgain){ syncAgain=false; syncNow(false) }
  }
}

/* ═══ POMOCNICZE ═══ */
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const normNum = s => String(s||'').toUpperCase().replace(/\s+/g,'');
let toastT;
function toast(m){const t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2400)}

function dayDiff(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr.length<=10 ? dateStr+'T00:00:00' : dateStr);
  if(isNaN(d)) return null;
  const a = new Date(); a.setHours(0,0,0,0);
  const b = new Date(d); b.setHours(0,0,0,0);
  return Math.round((b-a)/864e5);
}
function rel(ts){
  if(!ts) return '';
  const s = (Date.now()-new Date(ts).getTime())/1000;
  if(s<60) return 'przed chwilą';
  if(s<3600) return Math.floor(s/60)+' min temu';
  if(s<86400) return Math.floor(s/3600)+' godz. temu';
  const d=Math.floor(s/86400); return d===1?'wczoraj':d+' dni temu';
}
function fmtDate(ts, withTime=true){
  if(!ts) return '';
  const d = new Date(ts); if(isNaN(d)) return String(ts);
  const o = {day:'numeric', month:'short'};
  if(d.getFullYear()!==new Date().getFullYear()) o.year='numeric';
  let s = d.toLocaleDateString('pl-PL', o);
  if(withTime && !(String(ts).length<=10)) s += ', '+d.toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'});
  return s;
}
function lastText(p){
  if(p.statusText) return p.statusText;
  if(p.events && p.events[0]) return p.events[0].text;
  if(p.manual && (!p.status || p.status==='unknown')) return 'Sprawdź u przewoźnika i dodaj status';
  return STATUS[p.status||'unknown'].label;
}
function badge(c, status, size){
  const C = CARRIERS[c]||CARRIERS.other;
  const st = STATUS[status||'unknown'];
  return `<div class="cb" style="background:${C.bg};color:${C.fg}">${C.short}${status?`<span class="dot" style="background:${st.color}"></span>`:''}</div>`;
}

/* ═══ LISTA ═══ */
function inTab(p, tab){
  if(tab==='archived') return !!p.archived;
  if(p.archived) return false;
  return tab==='delivered' ? p.status==='delivered' : p.status!=='delivered';
}
function etaHtml(p){
  if(p.status==='delivered') return `<div class="eta"><span class="pill ok">Odebrana</span></div>`;
  if(p.status==='pickup') return `<div class="eta"><span class="pill pk">Odbierz</span></div>`;
  if(p.status==='out') return `<div class="eta today"><b>Dziś</b><span>dostawa</span></div>`;
  const d = dayDiff(p.eta);
  if(d===null) return '';
  if(d===0) return `<div class="eta today"><b>Dziś</b><span>dostawa</span></div>`;
  if(d===1) return `<div class="eta"><b>Jutro</b><span>dostawa</span></div>`;
  if(d>1) return `<div class="eta"><b>${d}</b><span>${plural(d,'dzień','dni','dni')}</span></div>`;
  return `<div class="eta late"><b>${-d}</b><span>dni po terminie</span></div>`;
}
function cardHtml(p, i){
  const C = CARRIERS[p.carrier]||CARRIERS.other;
  const meta = [C.name, p.lastChange?rel(p.lastChange):rel(p.created)].filter(Boolean).join(' · ');
  return `<div class="card" style="animation-delay:${Math.min(i,10)*30}ms" onclick="openDetail('${p.id}')">
    ${badge(p.carrier, p.status)}
    <div class="ci"><h3>${esc(p.name||p.number)}</h3><p>${esc(lastText(p))}</p><small>${esc(meta)}</small></div>
    ${etaHtml(p)}
  </div>`;
}
function render(){
  const q = ui.q.trim().toLowerCase();
  const all = S.parcels;
  for(const t of ['active','delivered','archived']){
    const n = all.filter(p=>inTab(p,t)).length;
    $('cnt-'+t).textContent = n?n:'';
  }
  const act = all.filter(p=>inTab(p,'active'));
  const nPick = act.filter(p=>p.status==='pickup').length;
  const nOut = act.filter(p=>p.status==='out').length;
  const parts = [];
  if(act.length) parts.push(`${act.length} ${plural(act.length,'aktywna','aktywne','aktywnych')}`);
  if(nOut) parts.push(`${nOut} dziś`);
  if(nPick) parts.push(`${nPick} do odbioru`);
  $('summary').textContent = parts.length?parts.join(' · '):'Wszystko odebrane';

  let items = all.filter(p=>inTab(p,ui.tab));
  if(q) items = items.filter(p=>(p.name||'').toLowerCase().includes(q)||p.number.toLowerCase().includes(q)||(p.note||'').toLowerCase().includes(q)||(CARRIERS[p.carrier]?.name||'').toLowerCase().includes(q));

  const L = $('list');
  if(!items.length){
    const msg = q ? ['Nic nie znaleziono','Spróbuj innej nazwy albo numeru.'] :
      ui.tab==='active' ? ['Brak aktywnych przesyłek','Dodaj numer przesyłki, a aplikacja rozpozna przewoźnika i będzie pilnować statusu.'] :
      ui.tab==='delivered' ? ['Nic jeszcze nie odebrano','Doręczone paczki pojawią się tutaj.'] :
      ['Archiwum jest puste','Zarchiwizowane przesyłki trafią tutaj.'];
    L.innerHTML = `<div class="empty"><div class="em-ic"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg></div><h2>${msg[0]}</h2><p>${msg[1]}</p></div>`;
    return;
  }
  if(ui.tab!=='active'){
    items.sort((a,b)=>new Date(b.lastChange||b.created)-new Date(a.lastChange||a.created));
    L.innerHTML = items.map(cardHtml).join('');
    return;
  }
  let html='', i=0;
  for(const g of GROUP_ORDER){
    const gi = items.filter(p=>(p.status||'unknown')===g);
    if(!gi.length) continue;
    gi.sort((a,b)=>{
      const da=dayDiff(a.eta), db=dayDiff(b.eta);
      if(da!==null&&db!==null&&da!==db) return da-db;
      if(da!==null&&db===null) return -1; if(db!==null&&da===null) return 1;
      return new Date(b.lastChange||b.created)-new Date(a.lastChange||a.created);
    });
    const st = STATUS[g];
    html += `<section class="grp"><div class="grp-h"><i style="background:${st.color}"></i>${g==='unknown'?'Brak informacji':st.group}</div>${gi.map(p=>cardHtml(p,i++)).join('')}</section>`;
  }
  L.innerHTML = html;
}
function plural(n,a,b,c){if(n===1)return a;const m10=n%10,m100=n%100;return(m10>=2&&m10<=4&&(m100<12||m100>14))?b:c}

/* ═══ ZAKŁADKI ═══ */
function moveInd(){
  const on = document.querySelector('.tab.on'); const ind=$('tabInd');
  ind.style.width = on.offsetWidth+'px';
  ind.style.transform = `translateX(${on.offsetLeft-4}px)`;
}
$('tabs').addEventListener('click',e=>{
  const b = e.target.closest('.tab'); if(!b) return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t===b));
  ui.tab = b.dataset.tab; moveInd(); render();
});
$('q').addEventListener('input',e=>{ui.q=e.target.value; render()});
window.addEventListener('resize', moveInd);

/* ═══ ARKUSZE ═══ */
function openSheet(id){ $(id).classList.add('on'); document.body.style.overflow='hidden' }
function closeSheet(id){ $(id).classList.remove('on'); if(!document.querySelector('.sw.on')) document.body.style.overflow='' }
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ const o=[...document.querySelectorAll('.sw.on')].pop(); if(o){ o.id==='scanSheet'?closeScan():closeSheet(o.id) } } });

/* ═══ DODAWANIE / EDYCJA ═══ */
function renderCarrierChips(){
  $('carrierChips').innerHTML = Object.entries(CARRIERS).map(([k,c])=>
    `<button class="chip ${ui.carrier===k?'on':''}" onclick="pickCarrier('${k}')"><i style="background:${c.bg}"></i>${c.name}</button>`).join('');
}
function pickCarrier(k){ ui.carrier=k; ui.carrierManual=true; renderCarrierChips(); updateHint() }
function updateHint(){
  const n = normNum($('fNum').value);
  const h = $('detHint');
  if(!n){ h.innerHTML=''; return }
  const dup = S.parcels.find(p=>p.number===n && p.id!==ui.editId);
  if(dup){ h.innerHTML = `⚠️ Ten numer już jest na liście: <b>${esc(dup.name||dup.number)}</b>`; return }
  if(ui.carrierManual){ h.innerHTML = `Wybrano: <b>${CARRIERS[ui.carrier]?.name||'—'}</b>`; return }
  const c = detectCarrier(n);
  h.innerHTML = c ? `Rozpoznano: <b>${CARRIERS[c].name}</b>` : 'Nie rozpoznano przewoźnika — wybierz poniżej';
}
$('fNum').addEventListener('input',()=>{
  if(!ui.carrierManual){ ui.carrier = detectCarrier($('fNum').value); renderCarrierChips() }
  updateHint();
});
function openAdd(p){
  ui.editId = p?p.id:null;
  $('addTitle').textContent = p?'Edytuj przesyłkę':'Nowa przesyłka';
  $('saveBtn').textContent = p?'Zapisz zmiany':'Dodaj przesyłkę';
  $('fNum').value = p?p.number:''; $('fName').value = p?(p.name||''):'';
  $('fEta').value = p&&p.eta?String(p.eta).slice(0,10):''; $('fNote').value = p?(p.note||''):'';
  ui.carrier = p?p.carrier:null; ui.carrierManual = !!p;
  renderCarrierChips(); updateHint();
  openSheet('addSheet');
  if(!p) setTimeout(()=>$('fNum').focus(),350);
}
async function pasteNum(){
  try{ const t = await navigator.clipboard.readText(); if(t){ $('fNum').value=t.trim(); $('fNum').dispatchEvent(new Event('input')) } }
  catch{ toast('Brak dostępu do schowka — wklej ręcznie') }
}
function saveParcel(){
  const number = normNum($('fNum').value);
  if(!number){ toast('Wpisz numer przesyłki'); $('fNum').focus(); return }
  if(S.parcels.find(p=>p.number===number && p.id!==ui.editId)){ toast('Ten numer już jest na liście'); return }
  const carrier = ui.carrier || detectCarrier(number) || 'other';
  const name = $('fName').value.trim();
  const eta = $('fEta').value || null;
  const note = $('fNote').value.trim();
  let p;
  if(ui.editId){
    p = S.parcels.find(x=>x.id===ui.editId);
    const numChanged = p.number!==number || p.carrier!==carrier;
    Object.assign(p,{number,carrier,name,note,etaManual:eta}); touch(p);
    if(eta) p.eta = eta;
    if(numChanged){ p.events=[]; p.status='unknown'; p.statusText=''; p.lastCheck=0 }
  }else{
    p = {id:uid(), number, carrier, name, note, eta, etaManual:eta, status:'unknown', statusText:'', events:[], created:new Date().toISOString(), lastChange:null, lastCheck:0, archived:false, manual:false, u:Date.now()};
    S.parcels.unshift(p);
  }
  save(); closeSheet('addSheet');
  if(!ui.editId && ui.tab!=='active'){ document.querySelector('[data-tab="active"]').click() }
  render();
  toast(ui.editId?'Zapisano ✓':'Dodano przesyłkę ✓');
  if(ui.editId && ui.detId===p.id) renderDetail();
  refreshOne(p, true);
}

/* ═══ SZCZEGÓŁY ═══ */
function openDetail(id){ ui.detId=id; renderDetail(); openSheet('detSheet') }
function renderDetail(){
  const p = S.parcels.find(x=>x.id===ui.detId); if(!p){ closeSheet('detSheet'); return }
  const C = CARRIERS[p.carrier]||CARRIERS.other;
  const st = STATUS[p.status||'unknown'];
  const step = st.step;
  const d = dayDiff(p.eta);
  let sub = '';
  if(p.status==='delivered') sub = p.lastChange?`Doręczono ${fmtDate(p.lastChange)}`:'';
  else if(p.status==='pickup') sub = p.pickupPoint?`Odbierz: ${p.pickupPoint}`:'Czeka na Ciebie w punkcie odbioru';
  else if(d!==null) sub = d===0?'Dostawa przewidziana na dziś':d===1?'Dostawa przewidziana na jutro':d>1?`Przewidywana dostawa: ${fmtDate(p.eta,false)} (za ${d} dni)`:`Termin minął ${-d} ${plural(-d,'dzień','dni','dni')} temu`;
  else if(p.lastChange) sub = `Ostatnia zmiana ${rel(p.lastChange)}`;
  const busy = ui.busy.has(p.id);
  const lbls = ['Nadana','W drodze','Doręczenie','Odebrana'];
  const evs = p.events||[];
  const checked = p.lastCheck?`Sprawdzono ${rel(p.lastCheck)}`:'Jeszcze nie sprawdzono';

  $('detBody').style.setProperty('--stc', st.color);
  $('detBody').innerHTML = `
    <div class="grab"></div>
    <div class="dt-top">
      ${badge(p.carrier)}
      <div style="flex:1;min-width:0"><h2>${esc(p.name||'Przesyłka')}</h2><p>${esc(C.name)} · ${checked}</p></div>
      <button class="ib" onclick="closeSheet('detSheet')" aria-label="Zamknij">✕</button>
    </div>
    <div class="st-card">
      <div class="st-lbl">${st.label}</div>
      <div class="st-txt">${esc(lastText(p))}</div>
      ${sub?`<div class="st-sub">${esc(sub)}</div>`:''}
      <div class="prog">${[0,1,2,3].map(i=>`<i class="${i<=step && p.status!=='unknown'?'on':''}" style="animation-delay:${i*80}ms"></i>`).join('')}</div>
      <div class="prog-l">${lbls.map(l=>`<span>${l}</span>`).join('')}</div>
    </div>
    <div class="btns" style="margin:0 0 12px">
      <button class="btn btn-s" onclick="refreshOne(S.parcels.find(x=>x.id==='${p.id}'), true, true)" ${busy?'disabled':''}>${busy?'Sprawdzam…':'Odśwież'}</button>
      <a class="btn btn-s" href="${C.url(encodeURIComponent(p.number))}" target="_blank" rel="noopener" style="text-decoration:none">Strona przewoźnika ↗</a>
    </div>
    <div class="info">
      <div class="info-r"><span class="k">Numer</span><span class="v mono">${esc(p.number)}</span><button onclick="copyNum('${esc(p.number)}')">Kopiuj</button></div>
      ${p.pickupPoint?`<div class="info-r"><span class="k">Punkt odbioru</span><span class="v">${esc(p.pickupPoint)}</span></div>`:''}
      ${p.eta?`<div class="info-r"><span class="k">Przewidywana dostawa</span><span class="v">${esc(fmtDate(p.eta,false))}</span></div>`:''}
      <div class="info-r"><span class="k">Dodano</span><span class="v">${esc(fmtDate(p.created))}</span></div>
      ${p.note?`<div class="info-r"><span class="k">Notatka</span><span class="v" style="word-break:break-word">${esc(p.note)}</span></div>`:''}
    </div>
    <div class="tl">
      <div class="tl-h"><h3>Historia</h3><button onclick="openEvent()">+ Dodaj status</button></div>
      ${evs.length? '<div>'+evs.map(e=>`<div class="ev"><div class="ev-d"></div><div><div class="ev-t">${esc(e.text)}</div><div class="ev-m">${esc([fmtDate(e.time), e.location].filter(Boolean).join(' · '))}</div></div></div>`).join('')+'</div>'
        : `<div class="tl-empty">${p.manual
            ? `Automatyczne śledzenie ${esc(C.name)} nie jest jeszcze skonfigurowane. Sprawdź status na stronie przewoźnika i dodaj go tutaj ręcznie albo ustaw klucz 17TRACK (Ustawienia).`
            : p.lastError ? `Nie udało się pobrać statusu: ${esc(p.lastError)}` : 'Brak zdarzeń. Przewoźnik może jeszcze nie mieć danych o tej paczce.'}</div>`}
    </div>
    <div class="btns">
      ${p.status!=='delivered'?`<button class="btn btn-s" onclick="markDelivered()">✓ Odebrana</button>`:`<button class="btn btn-s" onclick="reopen()">Przywróć</button>`}
      <button class="btn btn-s" onclick="toggleArchive()">${p.archived?'Z archiwum':'Archiwizuj'}</button>
      <button class="btn btn-s" onclick="openAdd(S.parcels.find(x=>x.id==='${p.id}'))">Edytuj</button>
      <button class="btn btn-d" onclick="delParcel()">Usuń</button>
    </div>`;
}
function copyNum(n){ navigator.clipboard?.writeText(n).then(()=>toast('Skopiowano numer'),()=>toast(n)) }
function cur(){ return S.parcels.find(x=>x.id===ui.detId) }
function setStatus(p, status, text, evt){
  const was = p.status;
  p.status = status; p.statusText = text||''; touch(p);
  if(evt) p.events.unshift(evt);
  if(was!==status){ p.lastChange = new Date().toISOString(); notifyChange(p) }
}
function markDelivered(){ const p=cur(); setStatus(p,'delivered','Odebrana',{time:new Date().toISOString(),text:'Oznaczono jako odebraną',location:'',manual:true}); save(); render(); renderDetail(); toast('Oznaczono jako odebraną ✓') }
function reopen(){ const p=cur(); touch(p); p.status = p.events.length?'transit':'unknown'; p.statusText=''; p.archived=false; save(); render(); renderDetail() }
function toggleArchive(){ const p=cur(); p.archived=!p.archived; touch(p); save(); render(); closeSheet('detSheet'); toast(p.archived?'Przeniesiono do archiwum':'Przywrócono z archiwum') }
function delParcel(){ const p=cur(); if(!confirm(`Usunąć „${p.name||p.number}”?`)) return; S.deleted[p.id]=Date.now(); S.parcels=S.parcels.filter(x=>x.id!==p.id); save(); render(); closeSheet('detSheet'); toast('Usunięto') }

/* ═══ RĘCZNE STATUSY ═══ */
const EV_OPTS = ['pending','transit','out','pickup','delivered','problem'];
function renderEvChips(){ $('evChips').innerHTML = EV_OPTS.map(k=>`<button class="chip ${ui.evStatus===k?'on':''}" onclick="ui.evStatus='${k}';renderEvChips()"><i style="background:${STATUS[k].color}"></i>${STATUS[k].label}</button>`).join('') }
function openEvent(){ const p=cur(); ui.evStatus = p.status&&p.status!=='unknown'?p.status:'transit'; $('evText').value=''; $('evLoc').value=''; renderEvChips(); openSheet('evSheet'); setTimeout(()=>$('evText').focus(),350) }
function saveEvent(){
  const p=cur(); const text=$('evText').value.trim()||STATUS[ui.evStatus].label;
  setStatus(p, ui.evStatus, text, {time:new Date().toISOString(), text, location:$('evLoc').value.trim(), manual:true});
  save(); render(); renderDetail(); closeSheet('evSheet'); toast('Dodano status ✓');
}

/* ═══ ŚLEDZENIE ═══ */
let apiOk = null;
async function refreshOne(p, force=false, loud=false){
  if(!p || p.archived || (p.status==='delivered' && !force)) return;
  if(!force && p.manual && Date.now()-(p.lastCheck||0) < 3600e3) return;
  if(ui.busy.has(p.id)) return;
  ui.busy.add(p.id); if(ui.detId===p.id && $('detSheet').classList.contains('on')) renderDetail();
  try{
    const r = await fetch(`/api/track?number=${encodeURIComponent(p.number)}&carrier=${encodeURIComponent(p.carrier)}`);
    if(r.status===401){ location.reload(); return }
    const ct = r.headers.get('content-type')||'';
    if(!ct.includes('json')) throw new Error('offline');
    const j = await r.json();
    apiOk = true;
    p.lastCheck = Date.now(); touch(p);
    if(j.manual){ p.manual = true; p.lastError=null; if(loud) toast('Ten przewoźnik wymaga klucza 17TRACK — dodaj status ręcznie') }
    else if(j.error){ p.lastError = j.error; if(loud) toast('Nie udało się pobrać statusu') }
    else{
      p.manual=false; p.lastError=null;
      if(Array.isArray(j.events) && j.events.length){
        const manualEv = (p.events||[]).filter(e=>e.manual);
        p.events = [...j.events, ...manualEv].sort((a,b)=>new Date(b.time)-new Date(a.time));
      }
      if(j.eta && !p.etaManual) p.eta = j.eta;
      if(j.pickupPoint) p.pickupPoint = j.pickupPoint;
      if(j.status && (j.status!=='unknown' || p.status==='unknown')){
        const latestTime = j.events && j.events[0] && j.events[0].time;
        const was = p.status;
        setStatus(p, j.status, j.statusText);
        if(was!==j.status && latestTime) p.lastChange = latestTime;
      }
      if(loud) toast('Zaktualizowano ✓');
    }
  }catch(e){
    apiOk = false; p.manual = true;
    if(loud) toast('Brak połączenia z serwerem śledzenia');
  }finally{
    ui.busy.delete(p.id);
    save(); render();
    if(ui.detId===p.id && $('detSheet').classList.contains('on')) renderDetail();
  }
}
let lastAutoRun = 0;
async function refreshAll(loud){
  lastAutoRun = Date.now();
  const b=$('refreshAll'); b.classList.add('spin');
  const list = S.parcels.filter(p=>!p.archived && p.status!=='delivered');
  for(const p of list){ await refreshOne(p, !!loud) }
  b.classList.remove('spin');
  if(loud) toast(list.length?'Sprawdzono wszystkie przesyłki':'Brak aktywnych przesyłek');
}
$('refreshAll').addEventListener('click',()=>refreshAll(true));

/* ═══ POWIADOMIENIA ═══ */
function notifyChange(p){
  if(!S.settings.notify || !('Notification' in window) || Notification.permission!=='granted') return;
  try{ new Notification(p.name||p.number, {body:`${STATUS[p.status]?.label||''}: ${lastText(p)}`, tag:p.id}) }catch{}
}
async function toggleNotify(){
  if(!S.settings.notify){
    if(!('Notification' in window)){ toast('Ta przeglądarka nie obsługuje powiadomień'); return }
    const perm = await Notification.requestPermission();
    if(perm!=='granted'){ toast('Brak zgody na powiadomienia'); return }
  }
  S.settings.notify=!S.settings.notify; save(); paintSettings();
}
function toggleAuto(){ S.settings.auto=!S.settings.auto; save(); paintSettings(); setupAuto() }
let autoT=null;
function setupAuto(){ clearInterval(autoT); if(S.settings.auto) autoT=setInterval(()=>refreshAll(false), 15*60e3) }

/* ═══ USTAWIENIA ═══ */
let srv = null; // {sync, track17} z /api/status
async function loadServerStatus(){
  try{ const r=await fetch('/api/status'); if(r.ok) srv=await r.json() }catch{}
}
function stateRow(ok, title, desc){
  const c = ok===true?'var(--c-delivered)':ok===false?'var(--c-problem)':'var(--c-pending)';
  return `<div class="tg-r"><div><b><span style="color:${c}">●</span> ${title}</b><span>${desc}</span></div></div>`;
}
function paintSettings(){
  $('tgNotify').classList.toggle('on', !!S.settings.notify);
  $('tgAuto').classList.toggle('on', !!S.settings.auto);
  let syncOk, syncDesc;
  if(syncInfo.state==='on'){ syncOk=true; syncDesc=`Włączona — ostatnio ${rel(syncInfo.last)}. Paczki są wspólne na wszystkich telefonach.` }
  else if(syncInfo.state==='off' || (srv && !srv.sync)){ syncOk=false; syncDesc='Wyłączona — w Vercelu podłącz bazę: Storage → Upstash (Redis) → Connect, potem Redeploy.' }
  else if(syncInfo.state==='error'){ syncOk=false; syncDesc='Błąd połączenia — spróbuj „Synchronizuj”.' }
  else { syncOk=null; syncDesc='Sprawdzam…' }
  const t17 = srv ? srv.track17 : null;
  $('srvState').innerHTML =
    stateRow(syncOk, 'Synchronizacja między telefonami', syncDesc) +
    stateRow(apiOk===false?false:true, 'InPost i Poczta Polska', apiOk===false?'Serwer śledzenia niedostępny.':'Statusy pobierają się automatycznie.') +
    stateRow(t17, 'DPD, DHL, GLS, UPS, FedEx, Orlen', t17===true?'Statusy pobierają się automatycznie (17TRACK).':t17===false?'Wymaga darmowego klucza z 17track.net jako zmiennej TRACK17_KEY w Vercelu.':'Sprawdzam…');
}
async function openSettings(){ paintSettings(); openSheet('setSheet'); await loadServerStatus(); paintSettings() }
function exportData(){
  const blob = new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`przesylki-${new Date().toISOString().slice(0,10)}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importData(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!Array.isArray(d.parcels)) throw 0;
    const have=new Set(S.parcels.map(p=>p.number)); let n=0;
    for(const p of d.parcels){ if(p&&p.number&&!have.has(p.number)){ S.parcels.push({events:[],status:'unknown',...p,id:p.id||uid(),u:Date.now()}); n++ } }
    save(); render(); toast(`Zaimportowano ${n} ${plural(n,'przesyłkę','przesyłki','przesyłek')}`);
  }catch{ toast('Nieprawidłowy plik') } };
  r.readAsText(f); e.target.value='';
}
function clearArchive(){
  const n=S.parcels.filter(p=>p.archived).length; if(!n){ toast('Archiwum jest puste'); return }
  if(!confirm(`Usunąć na stałe ${n} ${plural(n,'przesyłkę','przesyłki','przesyłek')} z archiwum?`)) return;
  for(const p of S.parcels) if(p.archived) S.deleted[p.id]=Date.now();
  S.parcels=S.parcels.filter(p=>!p.archived); save(); render(); toast('Wyczyszczono archiwum');
}

/* ═══ SKANER KODÓW ═══ */
let scanStream=null, scanLoop=null, zxReader=null;
function loadScript(src){ return new Promise((ok,err)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=err; document.head.appendChild(s) }) }
function onScanned(txt){
  const v = normNum(txt).replace(/[^0-9A-Z]/g,'');
  if(!v) return;
  closeScan();
  $('fNum').value = v; $('fNum').dispatchEvent(new Event('input'));
  if(navigator.vibrate) navigator.vibrate(30);
  toast('Zeskanowano ✓');
}
async function openScan(){
  openSheet('scanSheet');
  const video=$('scanV');
  $('scanHint').textContent='Nakieruj aparat na kod kreskowy z etykiety';
  try{
    if('BarcodeDetector' in window){
      scanStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
      video.srcObject=scanStream; await video.play();
      const det = new BarcodeDetector({formats:['code_128','code_39','ean_13','qr_code','data_matrix','itf','pdf417']});
      const tick = async()=>{
        if(!scanStream) return;
        try{ const r = await det.detect(video); if(r.length){ onScanned(r[0].rawValue); return } }catch{}
        scanLoop = requestAnimationFrame(tick);
      };
      tick();
    }else{
      $('scanHint').textContent='Ładuję skaner…';
      if(!window.ZXing) await loadScript('https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js');
      zxReader = new ZXing.BrowserMultiFormatReader();
      $('scanHint').textContent='Nakieruj aparat na kod kreskowy z etykiety';
      await zxReader.decodeFromConstraints({video:{facingMode:'environment'}}, video, (res)=>{ if(res) onScanned(res.getText()) });
    }
  }catch(e){
    $('scanHint').textContent='Brak dostępu do aparatu. Zezwól na kamerę albo wpisz numer ręcznie.';
  }
}
function closeScan(){
  if(scanLoop) cancelAnimationFrame(scanLoop); scanLoop=null;
  if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream=null }
  if(zxReader){ try{zxReader.reset()}catch{} zxReader=null }
  $('scanV').srcObject=null;
  closeSheet('scanSheet');
}

/* ═══ START ═══ */
(async function init(){
  load(); render(); moveInd();
  setTimeout(moveInd, 300);
  await syncNow(false);
  setupAuto();
  setInterval(()=>{ if(document.visibilityState==='visible') syncNow(false) }, 30e3);
  // odśwież statusy starsze niż 15 min
  const stale = S.parcels.filter(p=>!p.archived && p.status!=='delivered' && Date.now()-(p.lastCheck||0) > 5*60e3);
  lastAutoRun = Date.now();
  for(const p of stale) await refreshOne(p);
  setInterval(render, 60e3); // odświeżanie „x min temu”
  // po powrocie do aplikacji: pobierz zmiany z innych urządzeń i sprawdź statusy
  document.addEventListener('visibilitychange',async()=>{
    if(document.visibilityState!=='visible') return;
    await syncNow(false);
    if(Date.now()-lastAutoRun > 5*60e3) refreshAll(false);
  });
})();
</script>
